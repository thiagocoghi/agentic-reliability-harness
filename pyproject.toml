[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-reliability-harness"
version = "0.1.0"
description = "Production-grade AI agent reliability harness featuring circuit breakers, deterministic state machines, and CI/CD evals."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Thiago Coghi", email = "thiagocoghi@hotmail.com" }
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0"
]

[tool.pytest.ini_options]
testpaths = ["evals"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"
