name: AI Agent Reliability & CI/CD Evals

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ai-eval-harness:
    name: Run Reliability Evals & Circuit Breaker Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Deterministic Unit & Guardrail Tests
        run: |
          pytest evals/test_circuit_breaker.py -v --tb=short

      - name: Run Golden Dataset Agent Reliability Evals
        run: |
          pytest evals/test_agent_reliability.py -v --tb=short

      - name: Verify Code Compilation & Integrity
        run: |
          python -m py_compile agent/*.py agent/tools/*.py evals/*.py
